# ─────────────────────────────────────────────────────────────────────────────
# Nginx: api.prometeoperu.com → backend (127.0.0.1:4000)
# Se instala en /etc/nginx/sites-available/icgc-api. Certbot le agrega el
# bloque de https (puerto 443) y la redirección desde http automáticamente.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api.prometeoperu.com;

    # Videos de hasta 500 MB desde el gestor
    client_max_body_size 510m;

    # Fotos y videos: Nginx los sirve directo del disco, sin pasar por Node.
    # El nombre en disco lleva un hash, así que pueden cachearse un año.
    location /uploads/ {
        alias /opt/icgc/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # La web (Vercel) y el gestor muestran estas imágenes desde otro dominio
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # API
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Subidas grandes: se pasan al backend a medida que llegan
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;
}
