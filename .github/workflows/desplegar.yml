# ─────────────────────────────────────────────────────────────────────────────
# CI/CD del backend: cada push a main se verifica, se compila la imagen en el
# runner de GitHub, se guarda en GitHub Container Registry (ghcr.io) y se
# despliega en el servidor por SSH.
#
# El "switch" de servidor: la variable de repositorio DEPLOY_TARGET dice a qué
# GitHub Environment se despliega (por defecto "digitalocean"). Cada
# Environment tiene sus propios datos de conexión:
#   variables: SSH_HOST, SSH_USER, SSH_PORT (opcional), API_DOMAIN
#   secretos:  SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS (recomendado)
# Para cambiar de servidor: se crea otro Environment con sus datos y se cambia
# DEPLOY_TARGET. También se puede elegir a mano en "Run workflow".
# ─────────────────────────────────────────────────────────────────────────────
name: Desplegar backend

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.vscode/**']
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Environment de destino (vacío = el de DEPLOY_TARGET)'
        required: false
        default: ''

# Un despliegue a la vez; uno nuevo espera a que termine el anterior
concurrency:
  group: desplegar-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRO: ghcr.io
  # Carpeta del proyecto en el servidor (la usan el compose y Nginx)
  DIR_SERVIDOR: /opt/icgc

jobs:
  verificar:
    name: Verificar tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  imagen:
    name: Compilar y publicar imagen
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige el nombre en minúsculas
      - id: nombre
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "repo=$REGISTRO/$REPO" >> "$GITHUB_OUTPUT"
          echo "imagen=$REGISTRO/$REPO:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}
            ${{ steps.nombre.outputs.repo }}:latest
          # Liga el paquete al repositorio: así el GITHUB_TOKEN puede leerlo
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en ${{ inputs.entorno || vars.DEPLOY_TARGET || 'digitalocean' }}
    needs: imagen
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.entorno || vars.DEPLOY_TARGET || 'digitalocean' }}
      url: ${{ vars.API_DOMAIN && format('https://{0}/api/health', vars.API_DOMAIN) || '' }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || 'root' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::El Environment necesita la variable SSH_HOST y el secreto SSH_PRIVATE_KEY"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Falta el secreto SSH_KNOWN_HOSTS: se confía en la huella que entregue el servidor"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<EOF
          Host servidor
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Subir configuración
        run: |
          ssh servidor "mkdir -p $DIR_SERVIDOR"
          scp -q deploy/docker-compose.prod.yml "servidor:$DIR_SERVIDOR/docker-compose.prod.yml"
          scp -q deploy/actualizar.sh servidor:/tmp/icgc-actualizar-backend.sh
          # Sitio de Nginx con el dominio de este Environment (se instala solo
          # si el servidor todavía no lo tiene)
          sed "s/api\.prometeoperu\.com/${API_DOMAIN:-api.prometeoperu.com}/g" deploy/nginx-api.conf > /tmp/icgc-api.conf
          scp -q /tmp/icgc-api.conf servidor:/tmp/icgc-api.conf

      - name: Actualizar el backend
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
        run: |
          printf '%s\n' "$TOKEN" | ssh servidor \
            "DIR=$DIR_SERVIDOR SERVICIO=backend VAR_IMAGEN=BACKEND_IMAGE IMAGEN=$IMAGEN \
             SALUD_URL=http://127.0.0.1:4000/api/health \
             REGISTRO=$REGISTRO REGISTRO_USUARIO=${{ github.actor }} \
             NGINX_SITIO=icgc-api DOMINIO=$API_DOMAIN \
             bash /tmp/icgc-actualizar-backend.sh; e=\$?; rm -f /tmp/icgc-actualizar-backend.sh; exit \$e"

      - name: Comprobar desde internet
        if: env.API_DOMAIN != ''
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://$API_DOMAIN/api/health"

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_deploy
