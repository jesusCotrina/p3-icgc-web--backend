# ─────────────────────────────────────────────────────────────────────────────
# Producción en el droplet (1 vCPU / 512 MB): PostgreSQL + backend.
# Vive en /opt/icgc junto a su .env (lo crea instalar-servidor.sh).
#
#   cd /opt/icgc && docker compose -f docker-compose.prod.yml up -d
#
# - La imagen del backend la compila GitHub Actions y la guarda en GitHub
#   Container Registry (ghcr.io); el servidor solo la descarga. Compilar
#   TypeScript + Prisma en 512 MB agotaría la memoria.
# - BACKEND_IMAGE (en .env) es la imagen en uso; la escribe deploy/actualizar.sh.
# - Ningún puerto queda abierto a internet: Nginx es la única entrada.
# - Las fotos y videos van a /opt/icgc/uploads (Nginx los sirve directo).
# ─────────────────────────────────────────────────────────────────────────────
name: icgc

x-logs: &logs
  logging:
    driver: json-file
    # Sin tope, los logs llenan los 10 GB del disco con el tiempo
    options: { max-size: '5m', max-file: '3' }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    # Ajustes para poca memoria (por defecto PostgreSQL asume mucho más)
    command: >
      postgres
      -c shared_buffers=48MB
      -c effective_cache_size=128MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c wal_buffers=4MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 180m
    <<: *logs

  backend:
    image: ${BACKEND_IMAGE:-icgc-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # connection_limit bajo: cada conexión de PostgreSQL consume memoria
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=5
      UPLOAD_DIR: /app/uploads
      DISK_PATH: /app/uploads
      NODE_OPTIONS: --max-old-space-size=200
    # Solo escucha en el propio servidor: desde internet se entra por Nginx
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - /opt/icgc/uploads:/app/uploads
    mem_limit: 320m
    <<: *logs

volumes:
  postgres-data:
